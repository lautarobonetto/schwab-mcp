[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-mcp"
version = "0.6.3"
description = "Schwab OAuth access layer for local stdio MCP server"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "schwabdev==4.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
schwab-mcp = "schwab_mcp.cli:main"
schwab-mcp-release = "schwab_mcp_release.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: Performance-related tests (SC-004 budget)",
]
filterwarnings = ["error"]

# Explicit package list: the shipped wheel contains ONLY the runtime
# package `schwab_mcp`; the maintainer-only `schwab_mcp_release` tooling
# is structurally excluded (FR-003; research D2/D3).
[tool.setuptools]
packages = ["schwab_mcp"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
