[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-mcp"
version = "0.2.0"
description = "Schwab OAuth access layer for local stdio MCP server"
requires-python = ">=3.11"
dependencies = [
    "schwabdev==4.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
schwab-mcp = "schwab_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: Performance-related tests (SC-004 budget)",
]
filterwarnings = ["error"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
